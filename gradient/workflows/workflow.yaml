'on':
  github:
    branches:
      only: main
jobs:
  CloneRepo:
    resources:
      instance-type: C5
    outputs:
      repo:
        type: volume
    uses: git-checkout@v1
    with:
      url: "https://github.com/Merkle/diffusion-python-bot"
  HelloWorld:
    resources:
      instance-type: C5
    needs:
      - CloneRepo
