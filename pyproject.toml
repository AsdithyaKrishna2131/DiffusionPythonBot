[tool.poetry]
name = "diffusion-python-bot"
version = "0.1.0"
description = "A simple python discord bot for generating images via Stable Diffusion on a local pipeline. In active development, use at your own risk."
authors = ["Merkle <Merkle@>"]
packages = [{include = "diffusion_python_bot"}]

[tool.poetry.scripts]
bot = "diffusion_python_bot.main:main"

[tool.poetry.dependencies]
python = ">=3.9,<3.12"
tensorflow-io-gcs-filesystem = "0.31.0"
absl-py = "1.4.0"
accelerate = "0.18.0"
astunparse = "1.6.3"
cachetools = "5.3.0"
certifi = "2022.12.7"
charset-normalizer = "3.1.0"
diffusers = "0.14.0"
filelock = "3.10.5"
flatbuffers = "23.3.3"
gast = "0.4.0"
google-auth = "2.16.3"
google-auth-oauthlib = "0.4.6"
google-pasta = "0.2.0"
grpcio = "1.51.3"
h5py = "3.8.0"
huggingface-hub = "0.13.3"
idna = "3.4"
importlib-metadata = "6.1.0"
jax = "0.4.6"
keras = "2.12.0"
libclang = "16.0.0"
Markdown = "3.4.3"
MarkupSafe = "2.1.2"
mypy-extensions = "1.0.0"
numpy = "1.23.5"
nvidia-cublas-cu11 = "11.10.3.66"
nvidia-cublas-cu12 = "12.1.0.26"
nvidia-cuda-nvrtc-cu11 = "11.7.99"
nvidia-cuda-runtime-cu11 = "11.7.99"
nvidia-cuda-runtime-cu12 = "12.1.55"
